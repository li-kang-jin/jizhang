# 记账系统 —— Nginx 站点配置（纯 IP 部署，无域名、无 HTTPS）
#
# 部署到 /etc/nginx/sites-available/jizhang.conf，并软链到 sites-enabled/
# 由 deploy/prod/provision.sh 自动安装。
#
# 为什么同时监听 80 和 8081：
#   80 是主入口，安全组默认已放行。
#   8081 是「80 被运营商拦截」时的兜底入口，用非标端口绕开拦截。
#
# ⚠️ 兜底端口必须是 8081，不能是 8080：
#   后端 jar 自己监听 127.0.0.1:8080（见 application-prod.yml）。
#   Nginx 的 `listen 8080` 默认绑 0.0.0.0:8080，会和后端抢同一端口，
#   在 Linux 上直接报 EADDRINUSE 起不来。
#
# 路由分工：
#   /api/  → 后端 127.0.0.1:8080（管理后台与 Android 共用同一套接口）
#   /      → /opt/jizhang/admin-web 下的 Vue SPA（history 模式走 index.html 兜底）

server {
    listen 80 default_server;
    # 兜底端口（80 被拦时用），需要在安全组放行 TCP:8081 才生效
    listen 8081;
    server_name _;

    # 票据图片后续可能上传，先给个合理上限
    client_max_body_size 20m;
    client_body_timeout 60s;

    # 隐藏 nginx 版本号
    server_tokens off;

    root /opt/jizhang/admin-web;
    index index.html;

    # ---------- 后端接口 ----------
    # 注意 proxy_pass 末尾没有路径，/api/v1/xxx 会原样透传，与后端 @RequestMapping("/api/v1/...") 对齐
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;

        # 接口一律不缓存
        add_header Cache-Control "no-store" always;
    }

    # 健康检查（不对外暴露探针细节，只回状态码）
    location = /health {
        proxy_pass http://127.0.0.1:8080/actuator/health;
        access_log off;
    }

    # ---------- 静态资源 ----------
    # 带 hash 的构建产物可以放心长缓存
    location ~* \.(?:js|css|woff2?|ttf|eot|png|jpe?g|gif|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ---------- SPA 兜底 ----------
    location / {
        try_files $uri $uri/ /index.html;
        # index.html 不缓存，否则发版后用户拿到旧的资源清单
        add_header Cache-Control "no-cache" always;
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    access_log /var/log/nginx/jizhang.access.log;
    error_log  /var/log/nginx/jizhang.error.log warn;
}
