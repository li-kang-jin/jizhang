server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true
  shutdown: graceful

spring:
  application:
    name: jizhang-api
  profiles:
    active: dev
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jizhang:
  jwt:
    # 生产环境务必通过环境变量覆盖：JIZHANG_JWT_SECRET
    secret: ${JIZHANG_JWT_SECRET:jizhang-dev-secret-key-please-change-in-production-2026}
    access-expire-seconds: 7200
    refresh-expire-seconds: 604800

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: info
    com.jizhang: debug
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId}] %logger{36} - %msg%n"
